name: Phase 1 - Django backend checks

on:
  push:
    branches:
      - main
      - feature/phase-01-socle
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: btdigit_agro_test
          POSTGRES_USER: agro_ci
          POSTGRES_PASSWORD: ci_only_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agro_ci -d btdigit_agro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-long-random-dev-key-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: btdigit_agro_test
      POSTGRES_USER: agro_ci
      POSTGRES_PASSWORD: ci_only_test_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_INTERNAL_PORT: "5432"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Verify committed migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Django tests
        run: python manage.py test --verbosity=2
