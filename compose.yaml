# Phase 1.1 : backend Django + PostgreSQL (développement local uniquement).
services:
  # Frontend Vite : serveur de développement local, pas une image de production.
  web:
    build:
      context: ./frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - agro_frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${AGRO_WEB_PORT:-15173}:5173"
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_INTERNAL_PORT: "5432"
      # Vite fait suivre /api à http://api:8000 ; ajouter ce host Docker uniquement en dev.
      DJANGO_ALLOWED_HOSTS: "api,${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:${AGRO_API_PORT:-18080}:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-btdigit_agro}
      POSTGRES_USER: ${POSTGRES_USER:-btdigit_agro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD dans .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - agro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  agro_postgres_data:
  agro_frontend_node_modules:
